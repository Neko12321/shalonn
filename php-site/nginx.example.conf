# Point your HTTPS virtual host at public/, not the package directory.
# Add your own certificate directives and PHP-FPM socket.
server {
    listen 443 ssl;
    server_name example.com;
    root /var/www/shalom-bet/public;
    index index.php;
    client_max_body_size 6m;

    # ssl_certificate /your/certificate/fullchain.pem;
    # ssl_certificate_key /your/certificate/privkey.pem;

    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
    location ~ /\. { deny all; }
    location ~* \.(sqlite|sql|log|lock|bak)$ { deny all; }
}